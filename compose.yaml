name: qingfa-shop

services:
  gateway:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Gateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:-qingfa-compose-only-signing-key-change-me-32+}
      Gateway__Clusters__api: http://api:8080
      Gateway__Clusters__shopfront: http://shopfront:80
      Gateway__Clusters__admin: http://admin:80
    ports:
      - "5050:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/alive || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      shopfront:
        condition: service_started
      admin:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Web.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__db: Host=postgres;Port=5432;Database=db;Username=qingfa;Password=qingfa
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__rabbitmq: amqp://qingfa:qingfa@rabbitmq:5672
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/alive || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  shopfront:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/shopfront:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Web.Storefront/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/admin:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Web.Admin/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/admin/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: qingfa
      RABBITMQ_DEFAULT_PASS: qingfa
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/postgres:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Infrastructure/Postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: qingfa
      POSTGRES_PASSWORD: qingfa
      POSTGRES_DB: db
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingfa -d db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: ${DOCKER_REGISTRY:-qingfa-shop}/redis:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: app/Infrastructure/Redis/Dockerfile
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
