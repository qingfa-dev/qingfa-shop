server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enforce: Admin is mounted at /admin/ by Gateway and by its Vite base path.
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}