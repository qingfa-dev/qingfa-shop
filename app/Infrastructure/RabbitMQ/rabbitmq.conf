# Initialize: small-host defaults for the 0.5 CPU / 512 MB Compose limit.
# Keep the AMQP and management listeners explicit so host tooling and the
# container health check probe the same ports.

listeners.tcp.default = 5672
management.tcp.port = 15672

# Enforce: stop accepting publishes before the container limit turns into an
# OOM kill, and keep a small free-disk floor for the durable queues.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Detail: a consumer that stops acknowledging is cancelled after 30 minutes
# instead of holding an unacked delivery forever.
consumer_timeout = 1800000

heartbeat = 60
channel_max = 2047
