# Deploy overlay: pull the three application images and run upstream backing services.
#
# CD publishes only gateway, api, shopfront, and admin. The tuned Postgres/Redis
# wrappers in app/Infrastructure stay local, so a pull-only host uses the upstream
# images with the same tuning flags here instead of owning database image rebuilds.
#
# Usage:
#   DOCKER_REGISTRY=ghcr.io/<owner>/<repo> IMAGE_TAG=latest \
#     docker compose -f compose.yaml -f compose.deploy.yaml pull
#   DOCKER_REGISTRY=ghcr.io/<owner>/<repo> IMAGE_TAG=latest \
#     docker compose -f compose.yaml -f compose.deploy.yaml up -d --no-build

services:
  postgres:
    image: postgres:17-alpine
    build: !reset null
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB

  redis:
    image: redis:7-alpine
    build: !reset null
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
